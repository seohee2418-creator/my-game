<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퐁당퐁당 물과 흙 놀이</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Jua / Gaegu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Jua', 'Gaegu', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .bouncy {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.03); }
        }
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 h-screen w-screen flex flex-col justify-between overflow-hidden relative p-0 m-0">

    <script>
        // Audio state
        let audioInitialized = false;
        let waterSynth, mudSynth, splashNoise;

        function initAudio() {
            if (audioInitialized) return;
            Tone.start();

            // Water Sound Synth ("또잉" sound with frequency bend)
            waterSynth = new SynthWithDynamicPitch();

            // Mud Drop Sound ("툭" heavy dull drop)
            mudSynth = new Tone.MembraneSynth({
                pitchDecay: 0.08,
                octaves: 4,
                oscillator: { type: "sine" },
                envelope: {
                    attack: 0.001,
                    decay: 0.15,
                    sustain: 0.01,
                    release: 0.1
                }
            }).toDestination();
            mudSynth.volume.value = 2;

            audioInitialized = true;
        }

        // Custom Pitch Synth wrapper
        class SynthWithDynamicPitch {
            constructor() {
                this.synth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.005, decay: 0.3, sustain: 0.01, release: 0.3 }
                }).toDestination();
            }
            play(sizeMult = 1) {
                const now = Tone.now();
                // Bigger drops have lower base pitch and heavier tone
                const baseFreq = Math.max(150, 523 / Math.sqrt(sizeMult));
                const endFreq = baseFreq * 1.8;
                this.synth.triggerAttackRelease(baseFreq, "8n", now);
                this.synth.frequency.setValueAtTime(baseFreq, now);
                this.synth.frequency.exponentialRampToValueAtTime(endFreq, now + 0.15 * Math.min(sizeMult, 2));
            }
        }

        function playWaterSound(sizeMult = 1) {
            if (!audioInitialized) initAudio();
            waterSynth.play(sizeMult);
        }

        function playMudSound(sizeMult = 1) {
            if (!audioInitialized) initAudio();
            // Lower note for bigger mud drop
            const note = sizeMult > 2.2 ? "C1" : sizeMult > 1.4 ? "E1" : "G1";
            mudSynth.triggerAttackRelease(note, "16n");
        }
    </script>

    <!-- UI CONTAINER -->
    <div id="app" class="relative w-full h-full flex flex-col items-center justify-between p-2 md:p-4">

        <!-- SCENE 1: START SCREEN -->
        <div id="scene-start" class="flex flex-col items-center justify-center text-center z-10 space-y-6 pop-in my-auto">
            <div class="relative">
                <span class="text-7xl md:text-8xl bouncy inline-block">💧</span>
                <span class="text-7xl md:text-8xl bouncy inline-block" style="animation-delay: 0.3s">🌱</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-bold text-sky-600 drop-shadow-md leading-tight">
                퐁당퐁당<br/>물과 흙 놀이터
            </h1>
            <p class="text-xl md:text-2xl text-amber-700 bg-amber-100/80 px-6 py-2 rounded-full shadow-inner">
                손가락으로 물방울을 떨어뜨려봐요!
            </p>
            <button onclick="goToScene('select')" class="bg-yellow-400 hover:bg-yellow-300 text-amber-950 text-2xl md:text-3xl font-bold px-10 py-5 rounded-3xl shadow-lg border-b-8 border-yellow-600 active:border-b-0 active:translate-y-2 transition-all flex items-center space-x-3">
                <i class="fa-solid fa-play text-yellow-800"></i>
                <span>놀이 시작하기!</span>
            </button>
        </div>

        <!-- SCENE 2: SELECTION SCREEN -->
        <div id="scene-select" class="hidden flex-col items-center justify-center text-center z-10 w-full max-w-4xl space-y-8 pop-in my-auto">
            <h2 class="text-3xl md:text-5xl font-bold text-sky-700 drop-shadow">
                어디에서 놀아볼까요?
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full px-4">
                <!-- Water Basin Card -->
                <button onclick="startGame('water')" class="group bg-sky-100 hover:bg-sky-200 border-4 border-sky-400 rounded-3xl p-6 shadow-xl transition transform hover:-translate-y-2 flex flex-col items-center">
                    <div class="w-36 h-36 md:w-44 md:h-44 bg-sky-300 rounded-full flex items-center justify-center border-4 border-white shadow-inner mb-4 group-hover:scale-105 transition">
                        <span class="text-6xl md:text-7xl">🌊</span>
                    </div>
                    <span class="text-2xl md:text-3xl font-bold text-sky-800">찰랑찰랑 물 대야</span>
                    <p class="text-sky-600 mt-2 text-lg">"또잉!" 소리와 파문이 생겨요</p>
                </button>

                <!-- Mud Basin Card -->
                <button onclick="startGame('mud')" class="group bg-amber-100 hover:bg-amber-200 border-4 border-amber-600 rounded-3xl p-6 shadow-xl transition transform hover:-translate-y-2 flex flex-col items-center">
                    <div class="w-36 h-36 md:w-44 md:h-44 bg-amber-700 rounded-full flex items-center justify-center border-4 border-amber-900/30 shadow-inner mb-4 group-hover:scale-105 transition">
                        <span class="text-6xl md:text-7xl">🪵</span>
                    </div>
                    <span class="text-2xl md:text-3xl font-bold text-amber-900">푹신푹신 흙과 모래</span>
                    <p class="text-amber-800 mt-2 text-lg">"툭!" 소리와 물이 흙에 스며들어요</p>
                </button>
            </div>
            <button onclick="goToScene('start')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xl font-bold px-6 py-2 rounded-2xl shadow border-b-4 border-slate-400">
                <i class="fa-solid fa-arrow-left"></i> 처음으로
            </button>
        </div>

        <!-- SCENE 3: GAMEPLAY SCREEN -->
        <div id="scene-game" class="hidden flex-col items-center justify-between w-full h-full relative p-2 md:p-4 box-border overflow-hidden">
            <!-- Top Header Bar -->
            <div class="w-full flex justify-between items-center p-2 z-20 shrink-0 max-w-5xl">
                <button onclick="goToScene('select')" class="bg-white/90 hover:bg-white text-slate-700 text-lg md:text-xl font-bold px-4 py-2 rounded-2xl shadow-md border-2 border-slate-200 flex items-center space-x-2">
                    <i class="fa-solid fa-house"></i>
                    <span>고르기</span>
                </button>
                <div id="game-title" class="text-xl md:text-3xl font-bold px-6 py-2 rounded-full shadow-md bg-white/90 border-2">
                    <!-- Title updated dynamically -->
                </div>
                <button onclick="clearBasin()" class="bg-orange-400 hover:bg-orange-300 text-white text-lg md:text-xl font-bold px-4 py-2 rounded-2xl shadow-md border-b-4 border-orange-600 active:border-b-0 active:translate-y-1">
                    <i class="fa-solid fa-rotate-right"></i> 다시 하기
                </button>
            </div>

            <!-- Canvas Container (Maximizes Basin Size to fill screen space) -->
            <div id="canvas-container" class="relative w-full h-full flex-1 flex items-center justify-center p-0 m-0 overflow-hidden min-h-0 min-w-0">
                <canvas id="playCanvas" class="shadow-2xl cursor-pointer touch-none rounded-full"></canvas>
            </div>

            <!-- Bottom Instruction Banner -->
            <div class="w-full text-center pb-2 pt-1 z-20 shrink-0">
                <p id="game-instruction" class="text-base md:text-xl font-bold text-slate-700 bg-white/95 py-2 px-6 rounded-full inline-block shadow-lg border-2 border-slate-200">
                    <!-- Updated dynamically -->
                </p>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'water'; // 'water' or 'mud'
        let canvas, ctx;
        let animationFrameId;

        // Visual Object Stores
        let drops = [];
        let ripples = [];
        let mudSpots = [];
        let particles = [];

        // Press & Hold State
        let isPressing = false;
        let pressStartTime = 0;
        let pressPos = { x: 0, y: 0 };
        let chargingSize = 1;

        // Scene Manager
        function goToScene(sceneName) {
            initAudio();
            document.getElementById('scene-start').classList.add('hidden');
            document.getElementById('scene-select').classList.add('hidden');
            document.getElementById('scene-game').classList.add('hidden');

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            if (sceneName === 'start') {
                document.getElementById('scene-start').classList.remove('hidden');
            } else if (sceneName === 'select') {
                document.getElementById('scene-select').classList.remove('hidden');
            } else if (sceneName === 'game') {
                document.getElementById('scene-game').classList.remove('hidden');
            }
        }

        // Initialize Basin Gameplay
        function startGame(mode) {
            currentMode = mode;
            goToScene('game');

            const titleEl = document.getElementById('game-title');
            const instructEl = document.getElementById('game-instruction');

            if (mode === 'water') {
                titleEl.textContent = '💧 찰랑찰랑 물 대야';
                titleEl.className = 'text-xl md:text-3xl font-bold px-6 py-2 rounded-full shadow-md bg-sky-100 text-sky-800 border-2 border-sky-300';
                instructEl.innerHTML = '톡 누르면 <b>작은 물방울</b> 💧 / 꾸욱- 누르고 있으면 <b>왕 물방울!</b> 🌊';
            } else {
                titleEl.textContent = '🪵 푹신푹신 흙과 모래';
                titleEl.className = 'text-xl md:text-3xl font-bold px-6 py-2 rounded-full shadow-md bg-amber-100 text-amber-900 border-2 border-amber-300';
                instructEl.innerHTML = '톡 누르면 <b>작은 흙물</b> 🌱 / 꾸욱- 누르고 있으면 <b>넓게 스며드는 왕 물방울!</b> 🪵';
            }

            setupCanvas();
            clearBasin();
            animate();
        }

        function setupCanvas() {
            canvas = document.getElementById('playCanvas');
            ctx = canvas.getContext('2d');

            const container = document.getElementById('canvas-container');
            const availableWidth = container.clientWidth || window.innerWidth;
            const availableHeight = container.clientHeight || (window.innerHeight - 120);
            
            const size = Math.floor(Math.min(availableWidth, availableHeight) * 0.98);
            
            canvas.width = size;
            canvas.height = size;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';

            // Interaction Listeners (Mouse & Touch)
            canvas.onpointerdown = handlePointerDown;
            canvas.onpointermove = handlePointerMove;
            canvas.onpointerup = handlePointerUp;
            canvas.onpointercancel = handlePointerUp;
        }

        function clearBasin() {
            drops = [];
            ripples = [];
            mudSpots = [];
            particles = [];
            isPressing = false;
            chargingSize = 1;
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function isInsideBasin(x, y) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = (canvas.width / 2) - 15;
            return Math.hypot(x - centerX, y - centerY) <= radius;
        }

        function handlePointerDown(e) {
            e.preventDefault();
            const pos = getCanvasCoords(e);
            if (isInsideBasin(pos.x, pos.y)) {
                isPressing = true;
                pressStartTime = Date.now();
                pressPos = pos;
                chargingSize = 1;
            }
        }

        function handlePointerMove(e) {
            if (!isPressing) return;
            const pos = getCanvasCoords(e);
            pressPos = pos;
        }

        function handlePointerUp(e) {
            if (!isPressing) return;
            e.preventDefault();

            // Calculate final size based on press duration
            const duration = (Date.now() - pressStartTime) / 1000;
            const finalSizeMult = Math.min(3.5, 1 + duration * 2.2);

            if (isInsideBasin(pressPos.x, pressPos.y)) {
                // Drop water with calculated size
                drops.push({
                    x: pressPos.x,
                    y: Math.max(20, pressPos.y - (100 + finalSizeMult * 20)),
                    targetY: pressPos.y,
                    speed: 10 + finalSizeMult * 2,
                    radius: 10 * finalSizeMult,
                    sizeMult: finalSizeMult
                });
            }

            isPressing = false;
            chargingSize = 1;
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = (canvas.width / 2) - 15;

            // Update press & hold charging size
            if (isPressing) {
                const duration = (Date.now() - pressStartTime) / 1000;
                chargingSize = Math.min(3.5, 1 + duration * 2.2);
            }

            // 1. Draw Outer Basin Rim
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 12, 0, Math.PI * 2);
            ctx.fillStyle = currentMode === 'water' ? '#38bdf8' : '#d97706';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 4, 0, Math.PI * 2);
            ctx.fillStyle = currentMode === 'water' ? '#7dd3fc' : '#f59e0b';
            ctx.fill();

            // Clip inner region for Basin Content
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.clip();

            // 2. Draw Basin Surface Base
            if (currentMode === 'water') {
                let gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, radius);
                gradient.addColorStop(0, '#7dd3fc');
                gradient.addColorStop(0.7, '#38bdf8');
                gradient.addColorStop(1, '#0284c7');
                ctx.fillStyle = gradient;
                ctx.fill();
            } else {
                let gradient = ctx.createRadialGradient(centerX, centerY, 20, centerX, centerY, radius);
                gradient.addColorStop(0, '#d97706');
                gradient.addColorStop(0.6, '#b45309');
                gradient.addColorStop(1, '#78350f');
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                for (let i = 0; i < 200; i += 20) {
                    let angle = (i * 137.5) * Math.PI / 180;
                    let r = Math.sqrt(i) * (radius / 15);
                    let sx = centerX + r * Math.cos(angle);
                    let sy = centerY + r * Math.sin(angle);
                    ctx.beginPath();
                    ctx.arc(sx, sy, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 3. Render Mud Wet Spots
            if (currentMode === 'mud') {
                mudSpots.forEach(spot => {
                    if (spot.radius < spot.maxRadius) {
                        spot.radius += 0.4 * spot.speedMult;
                    }
                    if (spot.alpha > 0.4) {
                        spot.alpha -= 0.0008;
                    }

                    ctx.beginPath();
                    ctx.arc(spot.x, spot.y, spot.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(67, 20, 7, ${spot.alpha})`;
                    ctx.fill();

                    // Inner glossy wet sheen
                    ctx.beginPath();
                    ctx.arc(spot.x - spot.radius * 0.2, spot.y - spot.radius * 0.2, spot.radius * 0.35, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${spot.alpha * 0.35})`;
                    ctx.fill();
                });
            }

            // 4. Update and Render Ripples (Water Mode)
            ripples.forEach((r, index) => {
                r.radius += r.speed;
                r.alpha -= r.decay;

                if (r.alpha <= 0) {
                    ripples.splice(index, 1);
                    return;
                }

                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${r.alpha})`;
                ctx.lineWidth = r.lineWidth || 4;
                ctx.stroke();

                if (r.radius > 12) {
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius * 0.65, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(224, 242, 254, ${r.alpha * 0.7})`;
                    ctx.lineWidth = Math.max(1, (r.lineWidth || 4) * 0.6);
                    ctx.stroke();
                }
            });

            // 5. Update and Render Splash Particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.alpha -= 0.018;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                    return;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color.replace('1)', `${p.alpha})`);
                ctx.fill();
            });

            // 6. Charging Water Drop Preview (When holding down)
            if (isPressing) {
                const dropR = 12 * chargingSize;
                ctx.save();
                ctx.beginPath();
                ctx.arc(pressPos.x, pressPos.y, dropR, 0, Math.PI * 2);
                ctx.fillStyle = currentMode === 'water' ? 'rgba(56, 189, 248, 0.6)' : 'rgba(217, 119, 6, 0.6)';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Pulsing ring guide
                ctx.beginPath();
                ctx.arc(pressPos.x, pressPos.y, dropR + 6 + Math.sin(Date.now() / 80) * 3, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            // 7. Update and Render Falling Water Drops
            drops.forEach((drop, index) => {
                drop.y += drop.speed;

                ctx.beginPath();
                ctx.arc(drop.x, drop.y, drop.radius, 0, Math.PI);
                ctx.lineTo(drop.x, drop.y - drop.radius * 1.8);
                ctx.closePath();
                ctx.fillStyle = currentMode === 'water' ? '#e0f2fe' : '#fde68a';
                ctx.fill();
                ctx.strokeStyle = currentMode === 'water' ? '#0284c7' : '#92400e';
                ctx.lineWidth = 2 + drop.sizeMult;
                ctx.stroke();

                // Impact check when drop reaches target height
                if (drop.y >= drop.targetY) {
                    const sm = drop.sizeMult;
                    drops.splice(index, 1);

                    if (currentMode === 'water') {
                        playWaterSound(sm);
                        
                        // Scale ripple specs with size
                        ripples.push({ 
                            x: drop.x, 
                            y: drop.targetY, 
                            radius: 6 * sm, 
                            speed: 3 + sm * 1.2, 
                            alpha: 0.95, 
                            decay: 0.01 / Math.sqrt(sm), 
                            lineWidth: 4 + sm * 2 
                        });
                        
                        if (sm > 1.5) {
                            ripples.push({ 
                                x: drop.x, 
                                y: drop.targetY, 
                                radius: 3 * sm, 
                                speed: 2 + sm, 
                                alpha: 0.8, 
                                decay: 0.008 / Math.sqrt(sm), 
                                lineWidth: 2 + sm 
                            });
                        }

                        // Water Splash Particles
                        const count = Math.floor(8 * sm);
                        for (let i = 0; i < count; i++) {
                            const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
                            const spd = (2 + Math.random() * 3) * Math.sqrt(sm);
                            particles.push({
                                x: drop.x,
                                y: drop.targetY,
                                vx: Math.cos(angle) * spd,
                                vy: Math.sin(angle) * spd - (2 * sm),
                                gravity: 0.15,
                                size: (3 + Math.random() * 2) * Math.sqrt(sm),
                                alpha: 1,
                                color: 'rgba(224, 242, 254, 1)'
                            });
                        }
                    } else {
                        playMudSound(sm);
                        
                        // Mud Wet Spot Creation
                        mudSpots.push({
                            x: drop.x,
                            y: drop.targetY,
                            radius: 8 * sm,
                            maxRadius: (28 + Math.random() * 15) * sm,
                            alpha: 0.88,
                            speedMult: Math.min(2, sm)
                        });

                        // Mud Splash Particles
                        const count = Math.floor(6 * sm);
                        for (let i = 0; i < count; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const spd = (1 + Math.random() * 2) * Math.sqrt(sm);
                            particles.push({
                                x: drop.x,
                                y: drop.targetY,
                                vx: Math.cos(angle) * spd,
                                vy: Math.sin(angle) * spd - sm,
                                gravity: 0.2,
                                size: (2.5 + Math.random() * 2) * Math.sqrt(sm),
                                alpha: 1,
                                color: 'rgba(120, 53, 15, 1)'
                            });
                        }
                    }
                }
            });

            ctx.restore(); // Restore clip context

            // Soft shine reflection on Basin Plastic Rim
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, -Math.PI * 0.7, -Math.PI * 0.3);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 8;
            ctx.stroke();

            animationFrameId = requestAnimationFrame(animate);
        }

        // Handle Window Resize for fluid responsiveness
        window.addEventListener('resize', () => {
            if (!document.getElementById('scene-game').classList.contains('hidden')) {
                setupCanvas();
            }
        });
    </script>
</body>
</html>
